services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gms_user
      POSTGRES_PASSWORD: gms_pass
      POSTGRES_DB: gms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gms_user -d gms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gms-backend:
    build:
      context: ./backend/gms-backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    env_file:
      - ./backend/gms-backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://gms_user:gms_pass@postgres:5432/gms_db
      - SECRET_KEY=gms-secret-key-change-in-production-min-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - API_TARGET=http://gms-backend:8000
    depends_on:
      - gms-backend
    restart: unless-stopped

volumes:
  postgres-data:
